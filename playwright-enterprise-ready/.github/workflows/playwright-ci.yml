name: Playwright Tests - Necsus

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  NODE_VERSION: '20'
  BASE_URL: ${{ secrets.BASE_URL }}
  API_URL: ${{ secrets.API_URL }}
  ENV: ${{ vars.ENV || 'qa' }}
  TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
  TEST_PHONE: ${{ secrets.TEST_PHONE }}

jobs:
  test:
    name: Tests - ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 35

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chrome
            project: ui-chromium
            install-browser: chromium
          - browser: firefox
            project: ui-firefox
            install-browser: firefox

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            node-modules-${{ runner.os }}-

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.install-browser }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-${{ matrix.install-browser }}-

      - name: Install Playwright browser with deps
        run: npx playwright install --with-deps ${{ matrix.install-browser }}

      - name: Run ${{ matrix.browser }} smoke tests
        run: npx playwright test --project=${{ matrix.project }} --grep "@smoke"

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.browser }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.browser }}
          path: allure-results/
          if-no-files-found: ignore
          retention-days: 7

  report:
    name: Publish Allure report
    runs-on: ubuntu-latest
    needs: test
    if: always()
    timeout-minutes: 15

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Download Allure result artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: downloaded-allure-results
          merge-multiple: false

      - name: Prepare Allure results
        shell: bash
        run: |
          mkdir -p allure-results
          find downloaded-allure-results -type f -exec cp {} allure-results/ \;

          if [ -z "$(ls -A allure-results)" ]; then
            echo "No Allure results found. Creating placeholder result."
            cat > allure-results/placeholder-result.json <<'JSON'
          {"uuid":"placeholder","historyId":"placeholder","name":"No tests executed","status":"unknown","stage":"finished","start":0,"stop":0}
          JSON
          fi

      - name: Generate Allure report
        run: npx allure generate allure-results --clean -o allure-report

      - name: Upload Allure report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          if-no-files-found: error
          retention-days: 14

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v4

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: allure-report/

      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        id: deployment
        uses: actions/deploy-pages@v4
